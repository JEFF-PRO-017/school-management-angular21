<div class="d-flex vh-100 overflow-hidden">

  <!-- ── Sidebar desktop (masquée < md, repliable) ── -->
  <aside class="d-none d-md-flex flex-column bg-white sidebar-desktop" [class.border-end]="desktopOpen()"
    [style.width.px]="desktopOpen() ? 220 : 0">
    <!-- largeur fixe à l'intérieur pour éviter que le contenu soit écrasé pendant l'animation -->
    <div style="width:220px">
      <app-sidebar></app-sidebar>
    </div>
  </aside>

  <!-- ── Offcanvas sidebar mobile ── -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarOffcanvas" style="width:220px">
    <div class="offcanvas-header border-bottom py-2">
      <span class="fw-bold text-primary small">Menu</span>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fermer"></button>
    </div>
    <!-- Un clic sur un lien/bouton du menu ferme l'offcanvas -->
    <div class="offcanvas-body p-0" (click)="onMobileSidebarClick($event)">
      <app-sidebar></app-sidebar>
    </div>
  </div>

  <!-- ── Zone principale ── -->
  <div class="d-flex flex-column flex-grow-1 overflow-hidden">

    <app-header [sidebarOpen]="desktopOpen()" (toggleMenu)="toggleSidebar()"></app-header>
    <main class="flex-grow-1 overflow-auto bg-light" style="padding: 1rem 1rem 2rem">

      @if (loading()) {
      <div class="d-flex flex-column align-items-center justify-content-center" style="height:60vh">
        <mat-spinner diameter="48"></mat-spinner>
        <p class="text-muted mt-3 small">Chargement des données…</p>
      </div>
      } @else {
      <router-outlet></router-outlet>
      }

    </main>
  </div>
</div>
