<!-- header.component.html — barre supérieure, Bootstrap + Font Awesome -->
<header class="d-flex align-items-center gap-2 px-3 bg-white border-bottom" style="height:56px">

  <!-- Logo + burger : visibles uniquement sur mobile -->
  <div class="d-flex d-md-none align-items-center gap-2">
    <button class="btn btn-sm btn-light border-0 p-2" (click)="toggleMenu.emit()" aria-label="Ouvrir le menu">
      <fa-icon [icon]="icons.faBars"></fa-icon>
    </button>
    <img src="assets/icons/icon-72x72.png" width="22" height="22" alt="Logo" class="rounded-1">
    <span class="fw-semibold small text-primary">{{ titleApp }}</span>
  </div>

  <div class="flex-grow-1"></div>

  <!-- Section active (primaire / secondaire) -->
  <span class="badge rounded-pill text-bg-primary-subtle fw-normal">
    {{ section() === 'primaire' ? 'Primaire' : 'Secondaire' }}
  </span>

  <app-reseaux></app-reseaux>

  <!-- Compte utilisateur -->
  <div class="dropdown">
    <button class="btn btn-sm rounded-circle bg-primary-subtle fw-semibold border-0"
            style="width:34px;height:34px" data-bs-toggle="dropdown">
      {{ initiales() }}
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
      <li class="px-3 py-2">
        <div class="small fw-medium">{{ user()?.nom }}</div>
        <div class="small text-muted text-capitalize">{{ user()?.role }}</div>
      </li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <button class="dropdown-item small text-danger d-flex align-items-center gap-2" (click)="logout()">
          <fa-icon [icon]="icons.faRightFromBracket"></fa-icon> Déconnexion
        </button>
      </li>
    </ul>
  </div>

</header>
